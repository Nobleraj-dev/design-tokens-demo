<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in</title>
<link rel="stylesheet" href="base/tokens.css">
<link rel="stylesheet" href="base/styles.css">
</head>
<body>

  <div class="login-panel">
    <div class="logo-row">
      <svg class="logo-mark" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="21" fill="none" style="stroke: var(--color-primary);" stroke-width="2"/>
        <text x="24" y="29" text-anchor="middle" font-family="var(--font-family-ui)" font-size="13" font-weight="700" style="fill: var(--color-primary);">AI</text>
      </svg>
      <span class="logo-text">Touchless Lending</span>
    </div>

    <h1 class="login-title">Log in</h1>
    <p class="login-subtitle">Let's get started with your application</p>

    <form>
      <input type="text" class="field" placeholder="Username">
      <input type="password" class="field" placeholder="Password">

      <a href="#" class="forgot-link">Forgot Password?</a>

      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-outline">Login with One-Time PIN</button>

      <div class="signup-row">Don't have an account? <a href="#">Create account</a></div>
    </form>
  </div>

  <div class="illustration-panel">
    <svg viewBox="0 0 300 300" fill="none">
      <rect x="60" y="40" width="180" height="220" rx="24" style="fill: var(--color-primary);"/>
      <circle cx="150" cy="110" r="30" style="fill: var(--color-primary-text);"/>
      <rect x="90" y="165" width="120" height="16" rx="8" style="fill: var(--color-primary-text);"/>
      <rect x="90" y="192" width="120" height="16" rx="8" style="fill: var(--color-primary-text);"/>
      <circle cx="235" cy="75" r="10" style="fill: var(--color-tertiary);"/>
      <rect x="242" y="95" width="20" height="20" rx="6" style="fill: var(--color-tertiary);" transform="rotate(15 252 105)"/>
      <circle cx="30" cy="245" r="10" style="fill: var(--color-tertiary);"/>
    </svg>
  </div>

</body>
</html>
